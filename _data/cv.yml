        awarder: Danish Data Science Academy
        date: 2026
        summary: Fellowship supporting the PhD project on reliable cortical interface diffusion imaging via physics-informed deep learning.

      - title: Research Collaboration Scholarship
        awarder: Spanish Ministry of Education
        date: 2022
        summary: National scholarship awarded to initiate research careers; supported MRI research on olfactory rehabilitation after COVID-19.

    Skills:
      - name: Computational methods
        keywords: "Deep learning for inverse problems, 3D deformable image registration, domain adaptation, harmonization, statistical modeling, longitudinal analysis"

      - name: Programming and infrastructure
        keywords: "Python, PyTorch, MATLAB, Git, Linux, HPC clusters, pipeline automation, scientific programming"

      - name: Neuroimaging and MRI
        keywords: "Diffusion MRI, functional MRI, 7T ultra-high-field imaging, FreeSurfer, FSL, SPM, MRtrix3"

