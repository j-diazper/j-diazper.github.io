cv:
  name: Jesús Díaz Pereira
  label: DDSA PhD Fellow in AI for MRI
  email: jdiazper2001@gmail.com
  location: Copenhagen, Denmark
  image: ""
  summary: Biomedical engineer and AI researcher specializing in physics-informed deep learning for MRI reconstruction, artifact correction, and neuroimaging.

  social_networks:
    - network: GitHub
      username: j-diazper
    - network: LinkedIn
      username: jesús-díaz-pereira-2a24b624b

  sections:
    Education:
      - institution: Technical University of Denmark (DTU)
        location: Denmark
        area: Human-Centered Artificial Intelligence
        studyType: MSc
        start_date: 2023
        end_date: 2026
        highlights:
          - Specialized in deep learning for MRI reconstruction and artifact correction.
          - Master's thesis on deep learning for correcting susceptibility and eddy-current distortions in ultra-high-field diffusion MRI.

      - institution: Universidad Rey Juan Carlos
        location: Spain
        area: Biomedical Engineering
        studyType: BSc
        start_date: 2019
        end_date: 2023
        highlights:
          - Completed six courses with honors.
          - Bachelor's thesis on diffusion MRI analysis of olfactory rehabilitation in post-COVID-19 anosmia.

    Experience:
      - company: TracInnovations
        position: Student Engineer, MR Science Team
        location: Denmark
        start_date: 2024-09
        end_date: present
        highlights:
          - Designed and executed fMRI studies evaluating prospective motion correction performance using markerless optical tracking.
          - Contributed to technical validation of a k-space-domain retrospective motion correction pipeline using optical tracking-derived motion parameters.
          - Collaborated with MRI vendors on integration pathways for motion correction within scanner reconstruction workflows.

      - company: Danish Research Centre for Magnetic Resonance (DRCMR)
        position: Student Assistant, Neuroimaging in MS Group
        location: Denmark
        start_date: 2023-09
        end_date: 2024-08
        highlights:
          - Developed and maintained preprocessing pipelines for ultra-high-field diffusion MRI and quantitative MRI.
          - Harmonized neuroimaging datasets for sharing with the MAGNIMS network and multi-center 7T imaging analyses.

      - company: Medical Image Analysis Lab, Universidad Rey Juan Carlos
        position: Research Assistant
        location: Spain
        start_date: 2022-11
        end_date: 2023-06
        highlights:
          - Led diffusion MRI analysis and statistical evaluation for an industry-partnered study on post-COVID-19 anosmia.
          - Produced imaging-derived metrics supporting dissemination as a digital poster at ESMRMB 2023.
          - Work supported by a National Research Collaboration Scholarship from the Spanish Ministry of Education.

    Research Projects:
      - name: Reliable Cortical Interface Diffusion Imaging via Physics-Informed Deep Learning
        highlights:
          - DDSA-funded PhD project developing physics-informed implicit neural representations for high-resolution diffusion MRI from k-space data.
          - Aims to enable geometrically accurate in vivo diffusion imaging across cortical layers within feasible scan time.

      - name: Deep Learning for Susceptibility and Eddy-Current Distortion Correction in UHF Diffusion MRI
        highlights:
          - MSc thesis project at DTU and DRCMR.
          - Developed a physics-informed deep learning framework for joint susceptibility and eddy-current distortion correction in ultra-high-field diffusion MRI.

      - name: Analysis of Olfactory Rehabilitation in Post-COVID-19 Anosmia Patients using Diffusion MRI
        highlights:
          - BSc thesis project at Universidad Rey Juan Carlos and GE Healthcare.
          - Conducted a longitudinal diffusion MRI study to assess neuroplasticity following olfactory rehabilitation.

    Conference Abstracts and Posters:
      - title: Harnessing Open Innovation for Integrated Retrospective Motion Correction
        authors:
          - Coauthor
        publisher: ISMRM Annual Meeting & Exhibition
        releaseDate: 2026
        summary: Digital poster on integrating retrospective motion correction from an external tracker into Siemens OpenRecon.

      - title: Evaluation of Prospective Motion Correction in Functional MRI Using Markerless Optical Tracking
        authors:
          - First author
        publisher: ISMRM Annual Meeting & Exhibition
        releaseDate: 2025
        summary: Digital poster presented in Honolulu, HI, USA.

      - title: Diffusion MRI Tractography Reveals Neuroplasticity Following Olfactory Rehabilitation in Post-COVID-19 Anosmia
        authors:
          - Coauthor
        publisher: ESMRMB Annual Scientific Meeting
        releaseDate: 2023
        summary: Digital poster presented in Basel, Switzerland.

    Honors and Scholarships:
